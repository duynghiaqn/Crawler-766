name: Crawl DVCQG Data - Gia Lai (H21)

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      province:
        description: 'Province code to crawl (default H21 - UBND tỉnh Gia Lai)'
        required: false
        default: 'H21'
      year:
        description: 'Year (default: 2026)'
        required: false
        default: '2026'

permissions:
  contents: write

concurrency:
  group: crawler-766-crawl
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
          playwright install --with-deps chromium

      - name: Test DVCQG connectivity
        run: |
          python tools/test_dvcqg_connectivity.py

      - name: Bootstrap DVCQG province catalog
        run: |
          python tools/bootstrap_catalog_api.py --year ${{ github.event.inputs.year || '2026' }}

      - name: Run crawler for province
        run: |
          python tools/crawl_catalog.py \
            --year ${{ github.event.inputs.year || '2026' }} \
            --province-code "${{ github.event.inputs.province || 'H21' }}" \
            --force

      - name: Show generated files
        if: always()
        run: |
          find data -maxdepth 5 -type f -print 2>/dev/null || true

      - name: Commit and push updated data
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "📊 Update DVCQG Gia Lai data (${{ github.event.inputs.province || 'H21' }}) [skip ci]"
            git push
            echo "✅ Data successfully updated and pushed."
          fi
