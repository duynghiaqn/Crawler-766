name: Crawl DVCQG Detailed Data - All Units & Component Criteria (H21)

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      province:
        description: 'Province code to crawl (default H21 - UBND tỉnh Gia Lai)'
        required: false
        default: 'H21'
      year:
        description: 'Year (default: 2026)'
        required: false
        default: '2026'
      time_type:
        description: 'Time type (year, month, quarter)'
        required: false
        default: 'year'
        type: choice
        options:
          - year
          - month
          - quarter
      period:
        description: 'Period (Month 1-12 or Quarter 1-4, if time_type is month/quarter)'
        required: false
        default: '3'
      clean_days:
        description: 'Clean snapshot files older than N days'
        required: false
        default: '3'

permissions:
  contents: write

concurrency:
  group: crawler-766-detail-crawl
  cancel-in-progress: true

jobs:
  crawl-detail:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
          playwright install --with-deps chromium

      - name: Test DVCQG connectivity
        continue-on-error: true
        run: |
          python tools/test_dvcqg_connectivity.py --allow-fail

      - name: Bootstrap DVCQG province catalog
        continue-on-error: true
        run: |
          python tools/bootstrap_catalog_api.py --year ${{ github.event.inputs.year || '2026' }} --allow-fail --skip-if-exists

      - name: Run Gia Lai Detailed Component Indicators Crawler (crawl_gl_detail.py)
        run: |
          python tools/crawl_gl_detail.py \
            --time-type ${{ github.event.inputs.time_type || 'year' }} \
            --year ${{ github.event.inputs.year || '2026' }} \
            --period ${{ github.event.inputs.period || '3' }} \
            --clean-days ${{ github.event.inputs.clean_days || '3' }} \
            --concurrency 5 \
            --max-retries 6

      - name: Show generated detailed files
        if: always()
        run: |
          echo "📁 Listing generated detailed data files:"
          find data -maxdepth 5 -type f -print 2>/dev/null || true

      - name: Commit and push updated detailed data
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if git diff --staged --quiet; then
            echo "No detailed data changes to commit"
          else
            NOW=$(TZ='Asia/Ho_Chi_Minh' date +'%d/%m/%Y %H:%M:%S')
            git commit -m "📊 Update DVCQG Detailed & Units Score Data Gia Lai ($NOW) [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash -X ours origin main && git push origin main && echo "✅ Detailed data successfully updated and pushed." && break || sleep 3
            done
          fi

  notify:
    name: Gửi thông báo qua Telegram
    needs: [crawl-detail]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gửi thông báo qua Telegram
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          GAS_SECRET_KEY: ${{ secrets.GAS_SECRET_KEY }}
          STATUS: ${{ needs.crawl-detail.result }}
        run: |
          if [ -z "$GAS_WEBHOOK_URL" ]; then
            echo "⚠️ GAS_WEBHOOK_URL is not set. Skipping Telegram notification."
            exit 0
          fi

          TIME_VN=$(TZ='Asia/Ho_Chi_Minh' date +'%d/%m/%Y %H:%M:%S')

          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            STATUS_TEXT="THÀNH CÔNG (SUCCESS)"
          elif [ "$STATUS" = "failure" ]; then
            EMOJI="❌"
            STATUS_TEXT="THẤT BẠI (FAILURE)"
          else
            EMOJI="⚠️"
            STATUS_TEXT="ĐÃ HỦY (CANCELLED)"
          fi

          MESSAGE=$(printf "%s *[Crawler Chi tiết Đơn vị Gia Lai]*\n📌 *Trạng thái:* %s\n📂 *Workflow:* \`%s\`\n🏢 *Repository:* [%s](https://github.com/%s)\n⏰ *Thời gian:* %s (Giờ VN)\n👤 *Trigger:* \`%s\` (bởi %s)\n🔗 *Chi tiết:* [Xem log GitHub Action](https://github.com/%s/actions/runs/%s)" \
            "$EMOJI" "$STATUS_TEXT" "${{ github.workflow }}" "${{ github.repository }}" "${{ github.repository }}" "$TIME_VN" "${{ github.event_name }}" "${{ github.actor }}" "${{ github.repository }}" "${{ github.run_id }}")

          PAYLOAD=$(jq -n \
            --arg secret_key "$GAS_SECRET_KEY" \
            --arg secret "$GAS_SECRET_KEY" \
            --arg status "$STATUS" \
            --arg status_text "$STATUS_TEXT" \
            --arg workflow "${{ github.workflow }}" \
            --arg repository "${{ github.repository }}" \
            --arg actor "${{ github.actor }}" \
            --arg event_name "${{ github.event_name }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg time "$TIME_VN" \
            --arg message "$MESSAGE" \
            --arg text "$MESSAGE" \
            '{
              secret_key: $secret_key,
              secret: $secret,
              status: $status,
              status_text: $status_text,
              workflow: $workflow,
              repository: $repository,
              actor: $actor,
              event_name: $event_name,
              run_id: $run_id,
              run_url: $run_url,
              time: $time,
              message: $message,
              text: $text
            }')

          echo "📤 Gửi thông báo tới GAS Webhook ($STATUS)..."
          response=$(curl -s -L -X POST "$GAS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "📩 Phản hồi từ GAS: $response"

  purge:
    name: Purge jsDelivr CDN Cache
    needs: [crawl-detail]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Send Purge Requests to jsDelivr
        if: always()
        run: |
          URLS=(
            "https://purge.jsdelivr.net/gh/duynghiaqn/Crawler-766@main/data/gia_lai/index.json"
            "https://purge.jsdelivr.net/gh/duynghiaqn/Crawler-766@main/data/gia_lai/index_detail.json"
            "https://purge.jsdelivr.net/gh/duynghiaqn/Crawler-766@main/data/provinces/index.json"
            "https://purge.jsdelivr.net/gh/duynghiaqn/Crawler-766@main/data/provinces/index_detail.json"
          )

          echo "🚀 Purging jsDelivr CDN cache at $(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d %H:%M:%S %Z')..."
          for url in "${URLS[@]}"; do
            echo "--------------------------------------------------"
            echo "🔄 Requesting purge for: $url"
            response=$(curl -s -X GET "$url")
            echo "📩 Response: $response"
          done
          echo "--------------------------------------------------"
          echo "✅ All purge requests sent successfully at $(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d %H:%M:%S %Z')."

      - name: Warm-up jsDelivr CDN Cache (Tạo lại cache dữ liệu mới từ GitHub)
        if: always()
        run: |
          # Ánh xạ từ các tệp trên GitHub (branch main):
          # 1. https://github.com/duynghiaqn/Crawler-766/blob/main/data/gia_lai/index.json
          # 2. https://github.com/duynghiaqn/Crawler-766/blob/main/data/gia_lai/index_detail.json
          # 3. https://github.com/duynghiaqn/Crawler-766/blob/main/data/provinces/index.json
          # 4. https://github.com/duynghiaqn/Crawler-766/blob/main/data/provinces/index_detail.json
          CDN_URLS=(
            "https://cdn.jsdelivr.net/gh/duynghiaqn/Crawler-766@main/data/gia_lai/index.json"
            "https://cdn.jsdelivr.net/gh/duynghiaqn/Crawler-766@main/data/gia_lai/index_detail.json"
            "https://cdn.jsdelivr.net/gh/duynghiaqn/Crawler-766@main/data/provinces/index.json"
            "https://cdn.jsdelivr.net/gh/duynghiaqn/Crawler-766@main/data/provinces/index_detail.json"
          )

          echo "⏳ Chờ 5 giây để jsDelivr hoàn tất xoá cache cũ..."
          sleep 5

          echo "🚀 Đang kích hoạt tạo lại cache dữ liệu mới qua jsDelivr CDN at $(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d %H:%M:%S %Z')..."
          for url in "${CDN_URLS[@]}"; do
            echo "--------------------------------------------------"
            echo "🔥 Warm-up cache cho: $url"
            http_code=$(curl -s -L -o /dev/null -w "%{http_code}" "$url")
            echo "📩 HTTP Status Code: $http_code"
            if [ "$http_code" -eq 200 ]; then
              echo "✅ Cache mới đã được tạo thành công."
            else
              echo "⚠️ Cảnh báo: HTTP status code trả về $http_code"
            fi
          done
          echo "--------------------------------------------------"
          echo "✅ Hoàn tất tạo lại cache dữ liệu mới at $(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d %H:%M:%S %Z')."

