name: Crawl DVCQG Detailed Data - All Units & Component Criteria (H21)

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      province:
        description: 'Province code to crawl (default H21 - UBND tỉnh Gia Lai)'
        required: false
        default: 'H21'
      year:
        description: 'Year (default: 2026)'
        required: false
        default: '2026'
      time_type:
        description: 'Time type (year, month, quarter)'
        required: false
        default: 'year'
        type: choice
        options:
          - year
          - month
          - quarter
      period:
        description: 'Period (Month 1-12 or Quarter 1-4, if time_type is month/quarter)'
        required: false
        default: '3'
      clean_days:
        description: 'Clean snapshot files older than N days'
        required: false
        default: '3'

permissions:
  contents: write

concurrency:
  group: crawler-766-detail-crawl
  cancel-in-progress: true

jobs:
  crawl-detail:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
          playwright install --with-deps chromium

      - name: Test DVCQG connectivity
        continue-on-error: true
        run: |
          python tools/test_dvcqg_connectivity.py --allow-fail

      - name: Bootstrap DVCQG province catalog
        continue-on-error: true
        run: |
          python tools/bootstrap_catalog_api.py --year ${{ github.event.inputs.year || '2026' }} --allow-fail --skip-if-exists

      - name: Run Gia Lai Detailed Component Indicators Crawler (crawl_gl_detail.py)
        run: |
          python tools/crawl_gl_detail.py \
            --time-type ${{ github.event.inputs.time_type || 'year' }} \
            --year ${{ github.event.inputs.year || '2026' }} \
            --period ${{ github.event.inputs.period || '3' }} \
            --clean-days ${{ github.event.inputs.clean_days || '3' }} \
            --concurrency 5 \
            --max-retries 6

      - name: Show generated detailed files
        if: always()
        run: |
          echo "📁 Listing generated detailed data files:"
          find data -maxdepth 5 -type f -print 2>/dev/null || true

      - name: Commit and push updated detailed data
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if git diff --staged --quiet; then
            echo "No detailed data changes to commit"
          else
            git commit -m "📊 Update DVCQG Detailed Component Criteria & Units Score Data (${{ github.event.inputs.province || 'H21' }}) [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash -X ours origin main && git push origin main && echo "✅ Detailed data successfully updated and pushed." && break || sleep 3
            done
          fi
