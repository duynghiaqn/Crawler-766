name: Crawl DVCQG Data - All Provinces & Cities

on:
  schedule:
    - cron: '0 19 * * *' # 02:00 AM Việt Nam (19:00 UTC)
  workflow_dispatch:
    inputs:
      year:
        description: 'Year (default: 2026)'
        required: false
        default: '2026'
      time_type:
        description: 'Time type (year, month, quarter)'
        required: false
        default: 'year'
        type: choice
        options:
          - year
          - month
          - quarter
      period:
        description: 'Period (Month 1-12 or Quarter 1-4, if time_type is month/quarter)'
        required: false
        default: '3'
      clean_days:
        description: 'Clean snapshot files older than N days'
        required: false
        default: '3'

permissions:
  contents: write

concurrency:
  group: crawler-766-province-crawl
  cancel-in-progress: true

jobs:
  crawl-provinces:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
          playwright install --with-deps chromium

      - name: Test DVCQG connectivity
        continue-on-error: true
        run: |
          python tools/test_dvcqg_connectivity.py --allow-fail

      - name: Bootstrap DVCQG province catalog
        continue-on-error: true
        run: |
          python tools/bootstrap_catalog_api.py --year ${{ github.event.inputs.year || '2026' }} --allow-fail --skip-if-exists

      - name: Run All Provinces crawler (crawl_province.py)
        run: |
          python tools/crawl_province.py \
            --time-type ${{ github.event.inputs.time_type || 'year' }} \
            --year ${{ github.event.inputs.year || '2026' }} \
            --period ${{ github.event.inputs.period || '3' }} \
            --clean-days ${{ github.event.inputs.clean_days || '3' }}

      - name: Show generated province files
        if: always()
        run: |
          echo "📁 Listing generated province data files:"
          find data/provinces -maxdepth 5 -type f -print 2>/dev/null || true

      - name: Commit and push updated province data
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if git diff --staged --quiet; then
            echo "No province data changes to commit"
          else
            git commit -m "📊 Update DVCQG All Provinces & Cities Data Score [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash -X ours origin main && git push origin main && echo "✅ Province data successfully updated and pushed." && break || sleep 3
            done
          fi
