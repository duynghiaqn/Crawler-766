name: Crawl DVCQG Data - All Provinces & Cities

on:
  schedule:
    - cron: '0 19 * * *' # 02:00 AM Việt Nam (19:00 UTC)
  workflow_dispatch:
    inputs:
      year:
        description: 'Year (default: 2026)'
        required: false
        default: '2026'
      clean_days:
        description: 'Clean snapshot files older than N days'
        required: false
        default: '3'

permissions:
  contents: write

concurrency:
  group: crawler-766-province-crawl
  cancel-in-progress: true

jobs:
  crawl-provinces:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
          playwright install --with-deps chromium

      - name: Test DVCQG connectivity
        continue-on-error: true
        run: |
          python tools/test_dvcqg_connectivity.py --allow-fail

      - name: Bootstrap DVCQG province catalog
        continue-on-error: true
        run: |
          python tools/bootstrap_catalog_api.py --year ${{ github.event.inputs.year || '2026' }} --allow-fail --skip-if-exists

      - name: Run All Provinces crawler (crawl_province.py)
        run: |
          python tools/crawl_province.py \
            --time-type year \
            --year ${{ github.event.inputs.year || '2026' }} \
            --clean-days ${{ github.event.inputs.clean_days || '3' }} \
            --force \
            --timeout 90 \
            --max-retries 8

      - name: Show generated province files
        if: always()
        run: |
          echo "📁 Listing generated province data files:"
          find data/provinces -maxdepth 5 -type f -print 2>/dev/null || true

      - name: Commit and push updated province data
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if git diff --staged --quiet; then
            echo "No province data changes to commit"
          else
            NOW=$(TZ='Asia/Ho_Chi_Minh' date +'%d/%m/%Y %H:%M:%S')
            git commit -m "📊 Update DVCQG All Provinces & Cities Data Score ($NOW)"
            for i in 1 2 3; do
              git pull --rebase --autostash -X ours origin main && git push origin main && echo "✅ Province data successfully updated and pushed." && break || sleep 3
            done
          fi

  notify:
    name: Gửi thông báo qua Telegram
    needs: [crawl-provinces]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gửi thông báo qua Telegram
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          GAS_SECRET_KEY: ${{ secrets.GAS_SECRET_KEY }}
          STATUS: ${{ needs.crawl-provinces.result }}
        run: |
          if [ -z "$GAS_WEBHOOK_URL" ]; then
            echo "⚠️ GAS_WEBHOOK_URL is not set. Skipping Telegram notification."
            exit 0
          fi

          TIME_VN=$(TZ='Asia/Ho_Chi_Minh' date +'%d/%m/%Y %H:%M:%S')

          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            STATUS_TEXT="THÀNH CÔNG (SUCCESS)"
          elif [ "$STATUS" = "failure" ]; then
            EMOJI="❌"
            STATUS_TEXT="THẤT BẠI (FAILURE)"
          else
            EMOJI="⚠️"
            STATUS_TEXT="ĐÃ HỦY (CANCELLED)"
          fi

          MESSAGE=$(printf "%s *[Crawler Tất cả Tỉnh / Thành phố]*\n📌 *Trạng thái:* %s\n📂 *Workflow:* \`%s\`\n🏢 *Repository:* [%s](https://github.com/%s)\n⏰ *Thời gian:* %s (Giờ VN)\n👤 *Trigger:* \`%s\` (bởi %s)\n🔗 *Chi tiết:* [Xem log GitHub Action](https://github.com/%s/actions/runs/%s)" \
            "$EMOJI" "$STATUS_TEXT" "${{ github.workflow }}" "${{ github.repository }}" "${{ github.repository }}" "$TIME_VN" "${{ github.event_name }}" "${{ github.actor }}" "${{ github.repository }}" "${{ github.run_id }}")

          PAYLOAD=$(jq -n \
            --arg secret_key "$GAS_SECRET_KEY" \
            --arg secret "$GAS_SECRET_KEY" \
            --arg status "$STATUS" \
            --arg status_text "$STATUS_TEXT" \
            --arg workflow "${{ github.workflow }}" \
            --arg repository "${{ github.repository }}" \
            --arg actor "${{ github.actor }}" \
            --arg event_name "${{ github.event_name }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg time "$TIME_VN" \
            --arg message "$MESSAGE" \
            --arg text "$MESSAGE" \
            '{
              secret_key: $secret_key,
              secret: $secret,
              status: $status,
              status_text: $status_text,
              workflow: $workflow,
              repository: $repository,
              actor: $actor,
              event_name: $event_name,
              run_id: $run_id,
              run_url: $run_url,
              time: $time,
              message: $message,
              text: $text
            }')

          echo "📤 Gửi thông báo tới GAS Webhook ($STATUS)..."
          response=$(curl -s -L -X POST "$GAS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "📩 Phản hồi từ GAS: $response"
